<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drive Narrator — Offline</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 2.5rem 1.5rem;
        background: linear-gradient(160deg, #0f172a, #1e293b);
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      main {
        max-width: 28rem;
        background: rgba(15, 23, 42, 0.65);
        border-radius: 18px;
        padding: 2rem 1.75rem;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.4);
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 1rem;
      }
      p {
        line-height: 1.55;
        margin-bottom: 1.25rem;
      }
      button {
        background: #38bdf8;
        color: #0f172a;
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Headlights on standby</h1>
      <p>
        Drive Narrator is offline right now. We saved your last directions and stories, but we need a
        signal to fetch something new.
      </p>
      <button type="button" onclick="location.reload()">Retry connection</button>
    </main>
  </body>
</html>
