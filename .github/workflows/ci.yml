name: CI

on:
  push:
    branches: [ main, 001-product-overview-the ]
  pull_request:
    branches: [ main, 001-product-overview-the ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint workspace
        run: npm run lint

      - name: Backend tests
        run: npm run test --workspace @trip-narrator/backend

      - name: Frontend tests
        run: npm run test --workspace @trip-narrator/frontend

      - name: Shared package checks
        run: npm run lint --workspace @trip-narrator/shared

      - name: Frontend performance budget
        run: npm run test:performance --workspace @trip-narrator/frontend
